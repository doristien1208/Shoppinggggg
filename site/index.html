<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f8fb"><title>Shoppinggggg · 代購清單</title><link rel="stylesheet" href="styles.css?v=20261014-actions"><script type="module" src="app.js?v=20261014-actions"></script></head>
<body><main class="shell"><header><div class="brand">SHOPPINGGGGG</div><button disabled id="connect" class="secondary">解鎖清單</button></header>
<section class="intro"><p class="eyebrow">帶著清單，輕鬆出發</p><h1>這次，要買什麼？</h1><p class="sub">依地點整理，把帶回來的好物一一打勾。</p></section>
<div class="buyer-filter"><label for="buyer-filter">購買人</label><select id="buyer-filter"><option value="null">全部購買人</option></select></div>
<section class="summary" aria-label="採買進度"><div><span>已購買品項</span><strong id="progress">—</strong></div><div><span id="total-label">清單總額</span><strong id="total">—</strong></div><div class="track"><div id="bar"></div></div></section>
<div class="toolbar"><fieldset id="filters"><legend class="sr-only">購買狀態</legend><label><input type="radio" name="filter" value="all" checked><span>全部</span></label><label><input type="radio" name="filter" value="pending"><span>未購買</span></label><label><input type="radio" name="filter" value="done"><span>已購買</span></label></fieldset><button disabled id="add" class="primary">＋ 新增品項</button></div>
<nav id="tabs" aria-label="購買地點"></nav><div class="list-heading"><h2 id="list-title">全部地點</h2><div class="list-heading-actions"><span id="count"></span><button disabled id="retry" class="icon-button" aria-label="重新讀取清單" title="重新讀取"><span class="refresh-icon" aria-hidden="true"></span></button></div></div><p id="notice" role="status" aria-live="polite" hidden></p><div id="error" role="alert" hidden></div><ul id="list"></ul></main>
<dialog id="connection" aria-labelledby="connection-title"><form id="connection-form" novalidate><div class="dialog-head"><h2 id="connection-title">解鎖共用清單</h2><button disabled type="button" data-close aria-label="關閉">✕</button></div><p>輸入朋友分享給你的清單密碼，就能新增品項與勾選已購買。</p><label for="password">清單密碼</label><input id="password" type="password" autocomplete="current-password" spellcheck="false" aria-describedby="connection-error"><p id="connection-error" class="field-error" role="alert"></p><div class="actions"><button disabled type="button" id="disconnect" class="secondary">登出</button><button class="primary" type="submit">解鎖</button></div></form></dialog>
<dialog id="editor" aria-labelledby="editor-title"><form id="item-form" novalidate><div class="dialog-head"><h2 id="editor-title">新增品項</h2><button disabled type="button" data-close aria-label="關閉">✕</button></div><label for="buyer">購買人</label><input id="buyer" maxlength="80" autocomplete="off" placeholder="例如：Doris" required><label for="location">購買地點</label><input id="location" maxlength="80" required><label for="name">品名</label><input id="name" maxlength="160" required><div class="form-grid"><div><label for="price">日幣單價</label><input id="price" type="number" inputmode="numeric" min="0" step="1" required></div><div><label for="quantity">數量</label><input id="quantity" type="number" inputmode="numeric" min="1" step="1" value="1" required></div></div><label for="note">備註（選填）</label><input id="note" type="text" autocomplete="off" aria-describedby="note-counter note-error"><small id="note-counter">0 / 20 字</small><p id="note-error" class="field-error" role="alert"></p><label for="image">品項圖片（選填）</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG、PNG 或 WebP，最多 10 MB，上傳時會自動縮小</small><img id="preview" alt="新圖片預覽" hidden><p id="item-error" class="field-error" role="alert"></p><div class="actions"><button disabled type="button" data-close class="secondary">取消</button><button type="submit" class="primary">儲存品項</button></div></form></dialog>
<dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description"><h2 id="delete-title">刪除品項？</h2><p id="delete-description">確定刪除「<strong id="delete-name"></strong>」？</p><p id="delete-error" class="field-error" role="alert"></p><div class="actions"><button disabled type="button" data-close class="secondary" autofocus>取消</button><button disabled type="button" id="delete-confirm" class="danger">刪除品項</button></div></dialog>
<dialog id="image-viewer" class="image-viewer" aria-label="品項大圖"><div class="image-frame"><button disabled type="button" data-close class="image-close" aria-label="關閉大圖" autofocus>✕</button><img id="viewer-image" alt="" hidden><p id="viewer-status" role="status" hidden></p></div></dialog>
<dialog id="note-dialog" class="note-dialog" aria-labelledby="note-title" aria-describedby="note-message"><div class="note-card"><button disabled type="button" data-close class="image-close" aria-label="關閉備註" autofocus>✕</button><h2 id="note-title">備註</h2><p id="note-message"></p></div></dialog>
</body></html>
